<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#027b9a">
  <title>Family 100 — JADUL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bilah-atas">
    <div class="container bilah-atas-dalam">
      <a class="merek" href="index.html">
        <span class="merek-jadul">JADUL</span>
        <span class="merek-sub">Family 100</span>
      </a>
      <div class="progres" id="progres" role="img" aria-label="Progres pengerjaan soal"></div>
      <div class="chip-skor">
        <span class="chip-label">Skor total</span>
        <strong id="skor-total">0</strong>
      </div>
    </div>
  </header>

  <main class="container halaman" id="game-root">

    <section class="kartu-tanya">
      <p class="label-mini" id="judul-soal">Soal 1 dari 6</p>
      <h1 class="pertanyaan" id="pertanyaan"></h1>
    </section>

    <div class="baris-status">
      <div class="kotak-status">
        <span class="kotak-label">Skor soal ini</span>
        <span class="kotak-nilai" id="poin-soal">0</span>
      </div>
      <div class="kotak-status">
        <span class="kotak-label">Kesempatan</span>
        <span class="nyawa" id="nyawa" role="img" aria-label="Kesempatan tersisa 3 dari 3">
          <span class="nyawa-titik"></span>
          <span class="nyawa-titik"></span>
          <span class="nyawa-titik"></span>
        </span>
      </div>
    </div>

    <ul class="papan" id="daftar-jawaban"></ul>

    <p class="pesan" id="pesan" role="status" aria-live="polite" hidden></p>

    <div class="panel-selesai" id="panel-selesai" hidden>
      <p class="panel-selesai-judul" id="hasil-judul"></p>
      <p class="panel-selesai-skor" id="hasil-skor"></p>
      <div class="panel-aksi">
        <button class="tombol tombol--garis tombol--kecil" type="button" id="btn-ulang">Ulangi soal ini</button>
        <a class="tombol tombol--utama tombol--kecil" id="btn-lanjut" href="index.html">Lanjut</a>
        <a class="tombol tombol--garis tombol--kecil" href="index.html">Menu</a>
      </div>
    </div>

    <form class="bilah-jawaban" id="form-jawaban" autocomplete="off">
      <label class="visually-hidden" for="input-jawaban">Jawaban kamu</label>
      <input
        type="text"
        id="input-jawaban"
        placeholder="Tulis tebakanmu, lalu Enter"
        enterkeyhint="send"
        autocapitalize="characters"
        autocomplete="off"
        spellcheck="false">
      <button class="tombol tombol--utama" type="submit">Kirim</button>
    </form>

    <p class="kaki-tautan"><a href="index.html">&larr; Kembali ke menu</a></p>
  </main>

  <footer class="kaki">
    <div class="container kaki-dalam">
      <div class="kaki-merek">
        <img src="images/NF-removebg-preview.png" alt="Logo Natr Fawayd">
        <div>
          <strong>JADUL</strong>
          <span>From Natr Fawayd Ta'lim Agency</span>
        </div>
      </div>
      <p class="kaki-copy">&copy;2024 Nafis Hariri &middot; Survey Family 100</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
