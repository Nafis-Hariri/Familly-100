<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family 100 — JADUL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="Style2.css">
</head>
<body class="bgimage">
  <nav class="navbar fixed-top border-bottom">
    <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between gap-2">
      <a class="navbar-brand m-0 p-0" href="index.html">
        <h1 class="m-0">JADUL</h1>
      </a>
      <div class="nav-info">
        <span id="judul-soal">Soal 1 dari 6</span>
        <span class="nav-poin">Skor total: <strong id="skor-total">0</strong></span>
      </div>
    </div>
  </nav>

  <main class="container game-main" id="game-root">
    <div class="row">
      <div class="col-12 col-md-10 col-lg-8 mx-auto">

        <h2 class="pertanyaan" id="pertanyaan"></h2>

        <ul class="list-unstyled papan-jawaban" id="daftar-jawaban"></ul>

        <form class="input-group mb-3" id="form-jawaban" autocomplete="off">
          <label class="visually-hidden" for="input-jawaban">Jawaban kamu</label>
          <input
            class="form-control"
            type="text"
            id="input-jawaban"
            placeholder="Masukkan tebakan, lalu Enter"
            enterkeyhint="send"
            autocapitalize="characters"
            spellcheck="false">
          <button class="btn btn-success" type="submit">Kirim</button>
        </form>

        <div class="papan-skor">
          <div class="kartu-skor">
            <span class="kartu-skor-label">Skor soal ini</span>
            <span class="kartu-skor-nilai" id="poin-soal">0</span>
          </div>
          <div class="kartu-skor">
            <span class="kartu-skor-label">Kesempatan</span>
            <span class="kartu-skor-nilai" id="sisa-kesempatan">3</span>
          </div>
        </div>

        <p class="pesan" id="pesan" role="status" aria-live="polite" hidden></p>

        <div class="panel-selesai" id="panel-selesai" hidden>
          <p class="panel-selesai-judul" id="hasil-judul"></p>
          <p class="panel-selesai-skor" id="hasil-skor"></p>
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <button class="btn btn-outline-light btn-sm" type="button" id="btn-ulang">Ulangi soal ini</button>
            <a class="btn btn-success btn-sm" id="btn-lanjut" href="index.html">Lanjut</a>
            <a class="btn btn-outline-light btn-sm" href="index.html">Menu</a>
          </div>
        </div>

        <p class="tautan-menu"><a href="index.html">&larr; Kembali ke menu</a></p>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
